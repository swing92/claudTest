services:
  postgres:
    image: postgres:16-alpine
    container_name: lifehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lifehub}
      POSTGRES_USER: ${DB_USERNAME:-lifehub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifehub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - lifehub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lifehub} -d ${DB_NAME:-lifehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifehub-postgres-data:
